name: Android Appium

# GitHub uruchamia ten plik po pushu do repozytorium.
# Nie startujesz go z laptopa ani z IntelliJ.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  settings:
    name: Settings ${{ matrix.device }} API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Gdy jedno zadanie padnie, pozostałe idą dalej.
      fail-fast: false
      # Ten plik wybiera urządzenia i wersje Androida.
      matrix:
        device: [pixel_7, pixel_tablet]
        api-level: [34, 35]
    # Jedno zadanie = jeden emulator = jedna sesja Appium. Ta sama zasada co lokalnie.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Appium 3 and UiAutomator2
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version

      # Runner ma /dev/kvm, ale użytkownik runner nie jest w grupie kvm (0660).
      # Krok emulatora ma disable-linux-hw-accel: false, więc bez zapisu nie ma TCG.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm || true
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable. The emulator step requires KVM and does not pass -accel off."
            exit 1
          fi

      # Run 592f9e9 skasował system-images przez sudo i padł po ~10 min, przed 20-minutowym czekaniem na boot.
      # SDK na runnerze jest roota. Po rm katalogu runner nie utworzy go ponownie i sdkmanager kończy krok.
      # Zostaje miejsce na jeden obraz z macierzy (API 34 albo 35), bez NDK i bez nieużywanych platforms.
      - name: Free disk before the emulator
        run: |
          df -h /
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $sdk"
          if [ -d "$sdk" ]; then
            sudo du -sh "$sdk"/* 2>/dev/null || true
            sudo rm -rf "$sdk/system-images" "$sdk/platforms" "$sdk/ndk" "$sdk/ndk-bundle"
            sudo mkdir -p "$sdk/system-images" "$sdk/platforms"
            sudo chown -R "$USER:$USER" "$sdk"
          else
            echo "No preinstalled SDK at $sdk"
          fi
          df -h /

      - name: Settings tests on ${{ matrix.device }} API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          avd-name: test
          ram-size: 2048M
          # v2.38.0 tylko DOPISUJE disk.dataPartition.size. avdmanager wstawia wcześniej ~7372M,
          # a emulator bierze pierwszy wpis: przy 7162 MB wolnego był FATAL, zanim adb zobaczył urządzenie.
          # Skrypt po Create AVD kasuje wszystkie te linie i zostawia jedną 1024M.
          disk-size: 1024M
          disable-animations: true
          # false: akcja nie dopisuje -accel off. KVM włącza krok wyżej.
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          # -accel auto używa KVM. GPU zostaje programowe: log miał swiftshader,
          # a sprawdzenie sprzętowej karty było pominięte.
          # pixel_7 i pixel_tablet mają duży ekran. Przy swiftshader_indirect System UI dostaje ANR
          # ("System UI isn't responding") i zasłania Ustawienia. Mniejszy skin na obu profilach.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -accel auto -skin 720x1280
          # Jedna linia = jedno sh -c. Po Create AVD, przed startem emulatora.
          pre-emulator-launch-script: |
            cfg="${ANDROID_AVD_HOME}/test.avd/config.ini"; echo "AVD home: ${ANDROID_AVD_HOME}"; echo "disk.dataPartition.size before:"; grep -n '^disk.dataPartition.size=' "$cfg" || true; sed -i '/^disk.dataPartition.size=/d' "$cfg"; printf '%s\n' 'disk.dataPartition.size=1024M' >> "$cfg"; echo "disk.dataPartition.size after:"; grep -n '^disk.dataPartition.size=' "$cfg"; test "$(grep -c '^disk.dataPartition.size=1024M$' "$cfg")" = "1"; for key in hw.lcd.width hw.lcd.height skin.name skin.path skin.dynamic; do sed -i "/^${key}=/d" "$cfg"; done; printf '%s\n' 'hw.lcd.width=720' 'hw.lcd.height=1280' 'skin.name=720x1280' 'skin.dynamic=yes' >> "$cfg"; echo "lcd/skin after:"; grep -nE '^(hw.lcd.width|hw.lcd.height|skin.name|skin.dynamic)=' "$cfg"; df -h /
          # Każda linia script to osobny sh -c. Pętla musi być w jednej linii.
          # Skrypt startuje dopiero po boot-wait akcji; tu jeszcze raz czekamy,
          # ale kod 1 z adb (offline) nie kończy powłoki.
          script: |
            adb wait-for-device; boot=0; for i in $(seq 1 360); do prop=$(adb shell getprop sys.boot_completed 2>/dev/null || true); prop=$(printf '%s' "$prop" | tr -d '\r'); if [ "$prop" = "1" ]; then boot=1; break; fi; sleep 2; done; if [ "$boot" != "1" ]; then echo "Emulator stayed offline or did not set boot_completed=1 within 12 minutes"; exit 1; fi
            export PATH="$PATH:$(npm prefix -g)/bin"; nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 & echo $! > appium.pid; sleep 1
            ready=0; for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4723/status; then ready=1; break; fi; sleep 2; done; if [ "$ready" != "1" ]; then echo "Appium did not answer /status"; cat appium.log; exit 1; fi
            echo "Mark the fresh image provisioned so Settings home does not finish()"
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell am force-stop com.google.android.setupwizard || true
            adb shell am force-stop com.android.provision || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            chmod +x ./gradlew && ./gradlew test --tests tests.SettingsTest --no-daemon
      # Zrzuty są w build/failures na runnerze. Bez tego kroku job je kasuje.
      - name: Print failure notes
        if: failure()
        run: |
          if [ -d build/failures ]; then
            find build/failures -name '*.txt' -print -exec cat {} \;
          else
            echo "build/failures is missing"
          fi
      - name: Upload failure screenshots and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: settings-test-evidence-${{ matrix.device }}-api${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            build/failures
            build/reports/tests
      # Gradle i Allure piszą do build/ na hoście. Generowanie jest poza skryptem
      # emulatora, który kończy się kodem 1, więc raport powstaje także po padzie testów.
      - name: Generate single-file Allure report
        if: always()
        run: |
          npm install -g allure-commandline@2.46.1
          export PATH="$PATH:$(npm prefix -g)/bin"
          allure --version
          allure generate build/allure-results --clean --single-file -o build/appium-report
      - name: Tag reports with device and API
        if: always()
        run: |
          cell="${{ matrix.device }} ${{ matrix.api-level }}"
          if [ -d build/appium-report ]; then
            printf '%s\n' "$cell" > build/appium-report/matrix-cell.txt
          fi
          if [ -d build/reports/tests/test ]; then
            printf '%s\n' "$cell" > build/reports/tests/test/matrix-cell.txt
          fi
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-report-${{ matrix.device }}-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: build/appium-report
      # Surowe wyniki z build/allure-results. Job summary skleja je w jeden raport. Bez page source.
      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.device }}-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: build/allure-results
      - name: Upload Gradle HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-report-${{ matrix.device }}-api${{ matrix.api-level }}
          if-no-files-found: warn
          path: build/reports/tests/test

  # Jeden raport Allure ze wszystkich komórek. Także na pull request, jako artefakt.
  # Brak surowych wyników nie kończy workflowu. Anulowane testy pomijają ten job.
  summary:
    name: Overall Allure report
    needs: settings
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download raw Allure results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: allure-results-*
          path: incoming/allure-results

      - name: Merge Allure results into one report
        id: merge
        run: |
          merged="build/allure-results-all"
          report="build/appium-report-all"
          root="incoming/allure-results"
          rm -rf "$merged" "$report"
          mkdir -p "$merged"
          cells=0
          if [ -d "$root" ]; then
            sources=()
            while IFS= read -r dir; do
              [ -n "$dir" ] || continue
              sources+=("$dir")
            done < <(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
            if [ "${#sources[@]}" -eq 0 ]; then
              sources+=("$root")
            fi
            for src in "${sources[@]}"; do
              found=$(find "$src" -type f -name '*-result.json' -print -quit)
              if [ -z "$found" ]; then
                echo "no Allure results in ${src}"
                continue
              fi
              while IFS= read -r -d '' file; do
                cp -f "$file" "$merged/$(basename "$file")"
              done < <(find "$src" -type f -print0)
              cells=$((cells + 1))
              echo "merged Allure results from ${src}"
            done
          fi
          if [ "$cells" -eq 0 ]; then
            echo "No Allure results from any matrix cell; skipping the overall report."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes allure-commandline@2.46.1 generate "$merged" --clean --single-file -o "$report"
          if [ ! -f "$report/index.html" ]; then
            echo "Overall Allure report has no index.html" >&2
            exit 1
          fi
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "Overall report includes ${cells} matrix cell(s)."

      - name: Upload overall Allure report
        if: steps.merge.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appium-report-all
          if-no-files-found: error
          path: build/appium-report-all

  # Raport tego uruchomienia. Nie dodawaj tu workflow Jekyll ani Static HTML.
  # deploy-pages podmienia całą stronę, więc starsze uruchomienia trzymamy na gałęzi report-history.
  pages:
    needs:
      - settings
      - summary
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      # appium-report-all to osobny artefakt. Wzorzec z -api nie wciąga go między komórki.
      - name: Download Allure reports
        id: allure
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "appium-report-*-api*"
          path: incoming/allure

      - name: Download Gradle reports
        id: gradle
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: gradle-test-report-*
          path: incoming/gradle

      - name: Download overall Allure report
        id: allure_all
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: appium-report-all
          path: incoming/allure-all

      # Raport ogólny i te same cztery pary co strategy.matrix. Brak artefaktu nie blokuje pozostałych.
      - name: Assemble Pages site
        id: site
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          ALLURE_DIR: incoming/allure
          ALLURE_ALL_DIR: incoming/allure-all
          GRADLE_DIR: incoming/gradle
          MATRIX_CELLS: |
            pixel_7 34
            pixel_7 35
            pixel_tablet 34
            pixel_tablet 35
        run: bash .github/scripts/assemble-pages-site.sh

      - name: Upload GitHub Pages artifact
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.site.outputs.site_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.site.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

      - name: Push report-history
        if: ${{ always() && steps.site.outputs.deploy == 'true' && !cancelled() }}
        env:
          SITE_DIR: ${{ steps.site.outputs.site_dir }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/push-report-history.sh
