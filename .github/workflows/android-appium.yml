name: Android Appium

# GitHub uruchamia ten plik po pushu do repozytorium.
# Nie startujesz go z laptopa ani z IntelliJ.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Jedno zadanie = jeden emulator = jedna sesja Appium. Ta sama zasada co lokalnie.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Appium 3 and UiAutomator2
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version

      # Runner ma /dev/kvm, ale użytkownik runner nie jest w grupie kvm (0660).
      # Krok emulatora ma disable-linux-hw-accel: false, więc bez zapisu nie ma TCG.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm || true
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable. The emulator step requires KVM and does not pass -accel off."
            exit 1
          fi

      # Obraz runnera ma własne system-images. Zostało ~7 GB, a domyślny userdata API 36 chce ~7372 MB.
      # Akcja i tak dociąga jeden obraz google_apis x86_64 API 36. Kasujemy tylko to, czego ten job nie używa.
      - name: Free disk before the emulator
        run: |
          df -h /
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $sdk"
          if [ -d "$sdk" ]; then
            sudo du -sh "$sdk"/* 2>/dev/null || true
          else
            echo "No preinstalled SDK at $sdk"
          fi
          if [ -d "$sdk/system-images" ]; then
            sudo rm -rf "$sdk/system-images"
          fi
          sudo rm -rf "$sdk/ndk" "$sdk/ndk-bundle" || true
          df -h /

      - name: Settings tests on one API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: test
          ram-size: 2048M
          # v2.38.0 czyta disk-size i dopisuje disk.dataPartition.size na końcu config.ini.
          # avdmanager wpisuje wcześniej domyślne ~6–7 GB. Skrypt poniżej zostawia jedną linię 2048M.
          disk-size: 2048M
          disable-animations: true
          # false: akcja nie dopisuje -accel off. KVM włącza krok wyżej.
          disable-linux-hw-accel: false
          emulator-boot-timeout: 1200
          # -accel auto używa KVM. GPU zostaje programowe: log miał swiftshader,
          # a sprawdzenie sprzętowej karty było pominięte.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -accel auto
          # Jedna linia = jedno sh -c. Po Create AVD, przed startem emulatora.
          pre-emulator-launch-script: |
            cfg="${ANDROID_AVD_HOME}/test.avd/config.ini"; echo "disk.dataPartition.size before:"; grep -n '^disk.dataPartition.size=' "$cfg" || true; sed -i '/^disk.dataPartition.size=/d' "$cfg"; printf '%s\n' 'disk.dataPartition.size=2048M' >> "$cfg"; echo "disk.dataPartition.size after:"; grep -n '^disk.dataPartition.size=' "$cfg"; df -h /
          # Każda linia script to osobny sh -c. Pętla musi być w jednej linii.
          # Skrypt startuje dopiero po boot-wait akcji; tu jeszcze raz czekamy,
          # ale kod 1 z adb (offline) nie kończy powłoki.
          script: |
            adb wait-for-device; boot=0; for i in $(seq 1 360); do prop=$(adb shell getprop sys.boot_completed 2>/dev/null || true); prop=$(printf '%s' "$prop" | tr -d '\r'); if [ "$prop" = "1" ]; then boot=1; break; fi; sleep 2; done; if [ "$boot" != "1" ]; then echo "Emulator stayed offline or did not set boot_completed=1 within 12 minutes"; exit 1; fi
            export PATH="$PATH:$(npm prefix -g)/bin"; nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 & echo $! > appium.pid; sleep 1
            ready=0; for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4723/status; then ready=1; break; fi; sleep 2; done; if [ "$ready" != "1" ]; then echo "Appium did not answer /status"; cat appium.log; exit 1; fi
            echo "Mark the fresh image provisioned so Settings home does not finish() on API 36"
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell am force-stop com.google.android.setupwizard || true
            adb shell am force-stop com.android.provision || true
            chmod +x ./gradlew && ./gradlew test --tests tests.SettingsTest --no-daemon
      # Zrzuty są w build/failures na runnerze. Bez tego kroku job je kasuje.
      - name: Print failure UI dump
        if: failure()
        run: |
          if [ -d build/failures ]; then
            find build/failures -name '*.txt' -print -exec cat {} \;
          else
            echo "build/failures is missing"
          fi
      - name: Upload failure screenshots and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: settings-test-evidence
          if-no-files-found: ignore
          path: |
            build/failures
            build/reports/tests
